name: Bug report
description: Something does not work - mods not loading, a crash, a launch failure
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The diagnostic report answers most questions up front: distro, kernel,
        Proton build, Steam packaging, FUSE state and the Health checks. In the
        GUI, open the **Diagnostics** tab and press **Copy report**, then paste it
        below. Everything else is optional.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        Enabled 40 mods, launched from Steam. The game starts but SKSE reports no
        plugins loaded and none of the mods are visible in-game.
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: |
        Diagnostics tab, **Copy report** button. Home paths and your user name
        are replaced before it is copied. CLI only? Say so and fill in the
        optional system fields further down.
      render: text
    validations:
      required: true

  # The launch capability is optional: it only enables FUSE passthrough, which
  # is off by default. The report already says whether it was requested.
  - type: textarea
    id: getcap
    attributes:
      label: Output of getcap on your eidos binary (optional)
      description: |
        Only useful if you turned FUSE passthrough on (`EIDOS_FUSE_PASSTHROUGH=1`):

        ```sh
        which eidos && getcap "$(command -v eidos)"
        ```

        A binary that has the capability prints something ending in
        `cap_sys_admin=ep`. Empty output means it is missing. Grant it with:

        ```sh
        sudo setcap cap_sys_admin+ep "$(command -v eidos)"
        ```
      render: shell
    validations:
      required: false

  - type: dropdown
    id: cap-state
    attributes:
      label: Does the GUI report the capability as missing?
      description: The Diagnostics tab shows either "FUSE passthrough available" or "FUSE passthrough is off (launch capability missing)". A banner across the top says the same thing.
      options:
        - "Diagnostics says FUSE passthrough is available"
        - "Diagnostics says the launch capability is missing"
        - "I only use the CLI, no GUI"
        - "I could not tell"
    validations:
      required: false

  # Distro, kernel and Steam packaging together decide whether the mount can even
  # work: user namespaces are gated differently per distro, FUSE support varies by
  # kernel config, and a Flatpak Steam gives Proton a sandboxed runtime that Eidos
  # deliberately refuses to re-enter (running the game inside Flatpak's sandbox
  # would make it blind to the union mount and it would silently play vanilla).
  - type: textarea
    id: system
    attributes:
      label: Distro and kernel
      description: |
        ```sh
        (. /etc/os-release && echo "$PRETTY_NAME"); uname -r; ls -l /dev/fuse; command -v fusermount3
        ```
      render: shell
    validations:
      required: false

  - type: dropdown
    id: steam-packaging
    attributes:
      label: How is Steam installed?
      description: A Flatpak Steam ships Proton and its steamclient libraries inside the sandbox, so a host-side launch can fail to resolve them. Eidos flags this in Diagnostics and will not re-launch through `flatpak run`.
      options:
        - "Native package (pacman / apt / dnf / zypper)"
        - "Flatpak (com.valvesoftware.Steam)"
        - "Snap"
        - "Steam Deck / SteamOS"
        - "Not using Steam"
        - "Not sure"
    validations:
      required: false

  # The game and the launch path determine which code ran at all: `eidos play`
  # from a Steam launch option, the GUI's Run button, or a bare CLI invocation
  # take different routes into the same mount, and the script-extender swap only
  # happens on some of them.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - "Skyrim Special Edition (skyrimse)"
        - "Skyrim VR (skyrimvr)"
        - "Skyrim - Legendary Edition (skyrim)"
        - "Enderal: Special Edition (enderalse)"
        - "Fallout 4 (fallout4)"
        - "Fallout 4 VR (fallout4vr)"
        - "Fallout: New Vegas (falloutnv)"
        - "Fallout 3 GOTY (fallout3)"
        - "Oblivion (oblivion)"
        - "Morrowind (morrowind)"
        - "Starfield (starfield)"
        - "Other / not listed"
    validations:
      required: false

  - type: textarea
    id: launch
    attributes:
      label: How did you launch it?
      description: |
        Paste the exact Steam launch options if you use them, or the exact command
        line. Include the Proton version if you know it (Steam > game > Properties
        > Compatibility).
      placeholder: |
        Steam launch options: eidos play skyrimse -- %command%
        Proton: GE-Proton11-1
        or: eidos play skyrimse -- ./SkyrimSE.exe
        or: clicked Run in eidos-gui
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Launch log
      description: |
        Runs started from the GUI write the game's stdout and stderr to
        `~/.local/share/Colony/Eidos/instances/<game-id>/logs/run-<timestamp>.log` (or
        `<instance>/logs/` for a portable instance). Paste the tail of the newest
        one - Eidos's own warnings about the capability, failed binds and the
        mount all appear there. From a terminal launch, paste what `eidos play`
        printed.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Eidos version
      description: The release tag you installed, or `git rev-parse --short HEAD` if you built from source. The GUI shows it under About.
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Eidos?
      description: Building from source rewrites the binary, which wipes the capability every single time - a very common cause of "it worked yesterday".
      options:
        - "Colony (eidos-linux)"
        - "Release bundle + install.sh"
        - "Built from source (cargo build)"
        - "Distro package"
        - "Other"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mod list size, which mods, whether vanilla works, screenshots of the Diagnostics tab.
    validations:
      required: false

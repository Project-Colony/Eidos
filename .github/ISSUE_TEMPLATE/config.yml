# Blank issues stay ON. The only form here is the bug report, and a feature
# request or a question forced through it would just add noise to the fields
# that matter for real bugs.
blank_issues_enabled: true

contact_links:
  # Security reports must never land in the public tracker. This link opens a
  # private advisory draft; SECURITY.md explains scope.
  - name: Report a security vulnerability (private)
    url: https://github.com/Project-Colony/Eidos/security/advisories/new
    about: Do not open a public issue for a vulnerability - use a private advisory. See SECURITY.md for what is in scope.

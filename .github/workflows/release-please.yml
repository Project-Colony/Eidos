# Keeps a release PR open against main, built from the conventional-commit
# messages since the last release.
#
# The division of labour matters here. This workflow decides WHAT the next
# version is and writes the changelog; it does not build anything. Merging its PR
# creates the `vX.Y.Z` tag, and `release.yml` - which triggers on exactly that
# tag pattern - is what compiles, tests and publishes the artifacts. Neither
# needs to know about the other beyond the tag.
#
# So the flow is: land conventional commits on main -> a PR appears and keeps
# itself up to date -> merge it when the release is wanted.
name: release-please

on:
  push:
    branches: [main]
  # Useful after fixing a commit message, or to see the PR reappear without
  # waiting for the next push.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # The workspace is a virtual manifest: one `[workspace.package]`
          # version that all seventeen crates inherit, and no `[package]` at the
          # root at all. That is why the config uses `release-type: simple` and
          # names the version line outright - the `rust` type assumes a Cargo
          # package lives here and fails on the manifest that does not have one.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Cargo.lock pins every workspace member by version, and CI builds with
      # `--locked`. A release PR that bumped Cargo.toml alone would therefore
      # fail the moment it was merged - so the lock is brought along here.
      # `cargo metadata` re-resolves and rewrites it without compiling anything.
      - name: Keep Cargo.lock in step with the version
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=$(echo '${{ steps.rp.outputs.prs }}' | jq -r '.[0].headBranchName')
          [ -n "$branch" ] || exit 0
          git clone --branch "$branch" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pr
          cd pr
          cargo metadata --format-version 1 --no-deps >/dev/null
          git diff --quiet Cargo.lock && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock with the release version" Cargo.lock
          git push

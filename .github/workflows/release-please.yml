# Keeps a release PR open against main, built from the conventional-commit
# messages since the last release.
#
# The division of labour matters here. This workflow decides WHAT the next
# version is and writes the changelog; it does not build anything. Merging its PR
# creates the `vX.Y.Z` tag, and `release.yml` - which triggers on exactly that
# tag pattern - is what compiles, tests and publishes the artifacts. Neither
# needs to know about the other beyond the tag.
#
# So the flow is: land conventional commits on main -> a PR appears and keeps
# itself up to date -> merge it when the release is wanted.
name: release-please

on:
  push:
    branches: [main]
  # Useful after fixing a commit message, or to see the PR reappear without
  # waiting for the next push.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # The workspace is a virtual manifest: one `[workspace.package]`
          # version that all seventeen crates inherit, and no `[package]` at the
          # root at all. That is why the config uses `release-type: simple` and
          # names the version line outright - the `rust` type assumes a Cargo
          # package lives here and fails on the manifest that does not have one.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Cargo.lock pins every workspace member by version, and CI builds with
      # `--locked`. A release PR that bumped Cargo.toml alone would therefore
      # fail the moment it merged - so the lock is brought along here.
      #
      # The condition is the branch existing, not an output of the action above.
      # Conditioning on `prs_created` silently skipped this step, and a step that
      # skips looks exactly like a step that had nothing to do.
      - name: Keep Cargo.lock in step with the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="release-please--branches--${GITHUB_REF_NAME}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$url" "$branch" >/dev/null 2>&1; then
            echo "no release branch open - nothing to sync"
            exit 0
          fi
          git clone --branch "$branch" --depth 1 "$url" pr
          cd pr
          # Rewrites the workspace members' versions in the lock, and nothing
          # else - no external dependency is touched, and nothing is compiled.
          # (`cargo metadata --no-deps` does NOT do this: skipping resolution is
          # the whole point of that flag, so the lock is never rewritten.)
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already agrees with Cargo.toml"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock with the release version" Cargo.lock
          git push
          echo "Cargo.lock synced onto $branch"

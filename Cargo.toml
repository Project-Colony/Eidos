[workspace]
# Resolver 3 is resolver 2 plus rust-version-aware resolution: `cargo update`
# picks the newest release of each crate that still builds on the rust-version
# below, so a transitive crate raising its own floor cannot move ours by
# accident (design/dependencies.md in Project-Colony-Resources, "Toolchain").
resolver = "3"
members = ["crates/eidos-paths", "crates/eidos-core", "crates/eidos-fuse", "crates/eidos-games", "crates/eidos-launch", "crates/eidos-instance", "crates/eidos", "crates/eidos-gui", "crates/eidos-plugins", "crates/eidos-conflicts", "crates/eidos-install", "crates/eidos-fomod", "crates/eidos-gamefeatures", "crates/eidos-gamedef", "crates/eidos-ini", "crates/eidos-sevenzip", "crates/eidos-transfer", "crates/eidos-collections", "crates/eidos-nexus", "crates/eidos-loot", "crates/eidos-log", "crates/eidos-addons"]

[workspace.package]
# One version for the whole workspace. It reaches users in three places: the
# About dialog, the `Application-Version` header every Nexus API call carries,
# and the log header - so a release that left it at 0.0.0 would be telling Nexus
# something untrue about who is calling.
version = "1.24.1" # x-release-please-version
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Eidos"
edition = "2021"
# The oldest toolchain the workspace builds on, held honest by the msrv job in
# CI. rfd 0.18 needs 1.92, the most of any dependency, above the 1.89 of
# libloot 0.29 and the 1.88 of iced 0.14 and colony-ui. CI and releases build
# with a newer toolchain (RUST_VERSION in the workflows). Raise it deliberately,
# not because a crate raised its own.
rust-version = "1.92"

# Every external dependency, once, at its full current version: a floating
# "1.0" looks current forever while the lockfile ages, and the manifest is what
# a human reads (design/dependencies.md, "How versions are written"). Members
# inherit with `dep.workspace = true` and add their own features. The exact
# `=` pins and `default-features = false` live here too: a member cannot turn
# defaults back off, and each member's manifest says why it needs the crate.
[workspace.dependencies]
base64 = "0.23.1"
bcdec_rs = "=0.2.1"
bzip2 = "0.6.1"
colony-ui = "0.1.6"
crc32fast = "1.5.4"
ddsfile = "0.6.0"
dirs = "7.0.0"
encoding_rs = "0.8.44"
esplugin = "6.1.4"
flate2 = "1.1.11"
fuser = "0.18.0"
iced = "0.14.0"
iced_runtime = "0.14.0"
iced_tiny_skia = "0.14.1"
# Imported as `image_decoder`, so it never reads as iced's `image` widget.
image-decoder = { package = "image", version = "0.25.10", default-features = false }
libc = "0.2.191"
libloadorder = "=18.8.2"
libloot = "0.29.7"
lz4_flex = { version = "=0.14.0", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
object = { version = "0.40.0", default-features = false }
qbsdiff = { version = "=1.4.4", default-features = false }
quick-xml = "0.42.0"
rfd = "0.18.0"
ring = "0.17.14"
roxmltree = "0.21.2"
rustix = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
smol = "2.0.2"
tempfile = "3.27.0"
toml = "1.2.1"
ureq = "3.5.1"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[profile.release]
# The Colony release profile (design/releases.md in Project-Colony-Resources,
# "Release profile"): one codegen unit and no symbol table. Eidos takes fat LTO
# where that profile says thin, for size (measurements below).
#
# One codegen unit instead of the default 16. Measured on a real 182-layer
# instance: the binary loses 22% (eidos-gui 40.6 -> 31.8 MB, eidos 29.3 -> 26.8)
# for 12% more build time, and NOTHING measurable in speed - path resolution
# stayed at 2.8 µs and a forced directory walk at ~610 ms either way, because
# both are bound by syscalls rather than by generated code.
#
# The size is where it pays: at 16 units LLVM cannot see across them, so the
# same monomorphised code lands in several and ships several times over.
#
# Fat LTO. Measured on 2026-11-10 with rustc 1.99.1: one cold
# `cargo build --profile release -p eidos -p eidos-gui` per variant, 3 build
# jobs, sizes in bytes after strip:
#
#   variant                                   eidos     eidos-gui  build
#   thin LTO (the profile before this one)    22117176  53567752   243 s
#   fat LTO (this profile)                    20870160  49727560   334 s
#   thin LTO, GUI stack at opt-level "s"      22116368  51839880   234 s
#   fat LTO, GUI stack at opt-level "s"       20871056  48080456   325 s
#
# Fat LTO takes 1.2 MB (5.6%) off eidos and 3.8 MB (7.2%) off eidos-gui for
# 37% more build time. The GUI stack was given `opt-level = "s"` through
# `[profile.release.package.<name>]` for iced, iced_core, iced_widget,
# iced_graphics, iced_renderer, iced_wgpu, iced_tiny_skia, iced_winit, wgpu,
# wgpu-core, wgpu-hal, naga, cosmic-text, swash, skrifa, read-fonts, fontdb,
# tiny-skia and colony-ui. On top of fat LTO it saved another 1.6 MB (3.3%) of
# eidos-gui, too little to give up speed in the renderer and text shaping for,
# so every crate stays at opt-level 3.
#
# `strip = "symbols"` drops the symbol table. The cost is that a panic
# backtrace from a release binary shows addresses instead of function names,
# so a crash report needs the session log's message and the steps, or a
# rebuild with symbols.
#
# `panic = "abort"` is deliberately absent and should stay absent: there are
# ~15 worker threads in production paths (archive extraction, the game-exit
# watcher, downloads), and `catch_unwind` only around the two jobs on smol's
# blocking pool whose panic would otherwise be lost (an install's copy step,
# download identify). Aborting would turn a panic in any one of them into the
# whole window dying, where today the poll reports it and the window survives.
codegen-units = 1
lto = "fat"
strip = "symbols"

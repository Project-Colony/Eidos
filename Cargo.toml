[workspace]
resolver = "2"
members = ["crates/eidos-paths", "crates/eidos-core", "crates/eidos-fuse", "crates/eidos-games", "crates/eidos-launch", "crates/eidos-instance", "crates/eidos", "crates/eidos-gui", "crates/eidos-plugins", "crates/eidos-conflicts", "crates/eidos-install", "crates/eidos-fomod", "crates/eidos-gamefeatures", "crates/eidos-gamedef", "crates/eidos-ini", "crates/eidos-nexus", "crates/eidos-loot", "crates/eidos-log", "crates/eidos-addons"]

[workspace.package]
# One version for the whole workspace. It reaches users in three places: the
# About dialog, the `Application-Version` header every Nexus API call carries,
# and the log header - so a release that left it at 0.0.0 would be telling Nexus
# something untrue about who is calling.
version = "1.8.0" # x-release-please-version
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Eidos"
edition = "2021"

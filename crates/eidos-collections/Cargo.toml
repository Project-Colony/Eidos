[package]
name = "eidos-collections"
version.workspace = true
description = "Nexus collections: read a collection's manifest and install it the way its author built it"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
# `collection.json` is JSON, and a tolerant derive is exactly what a format with
# no version field and no closed set of keys needs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The driver half: the network, the archiver and the installer. The pure modules
# beside it use none of these, and their tests need none of them either.
eidos-instance = { path = "../eidos-instance" }
eidos-nexus = { path = "../eidos-nexus" }
eidos-install = { path = "../eidos-install" }
eidos-fomod = { path = "../eidos-fomod" }
eidos-loot = { path = "../eidos-loot" }
eidos-plugins = { path = "../eidos-plugins" }
eidos-games = { path = "../eidos-games" }
eidos-sevenzip = { path = "../eidos-sevenzip" }

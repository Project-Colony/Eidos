[package]
name = "eidos-gamefeatures"
version.workspace = true
description = "Eidos per-game Bethesda features: BSA/archive invalidation, INI tweaks, save redirection"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
eidos-paths = { path = "../eidos-paths" }
eidos-gamedef = { path = "../eidos-gamedef" }
eidos-ini = { path = "../eidos-ini" }
# PE import-table parsing, to detect mods that import d3dcompiler_47.dll.
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "coff", "std"] }
# Inflate for the zlib-compressed save payload (savegame.rs). Already in the
# workspace lockfile via png/tiff/ureq, and the default features are the pure-Rust
# miniz_oxide backend, so this adds no new crate and no C dependency. The LZ4 side
# is decoded in-crate: see lz4_block_decompress for why.
flate2 = "1"
# Fetching the .NET runtime DynDOLOD's LODGen needs (runtime.rs). Already in the
# workspace via eidos-nexus and eidos-loot, so this is a line here and no new
# build.
ureq = "3"

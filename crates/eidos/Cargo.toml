[package]
name = "eidos"
version.workspace = true
description = "Eidos: a native Linux mod manager (CLI front end)"
license.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "eidos"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eidos-addons = { path = "../eidos-addons" }
eidos-paths = { path = "../eidos-paths" }
# Session logs: a launch started from Steam has no terminal, so the file is the
# only record of what happened - and the GUI's Log pane reads exactly these.
eidos-log = { path = "../eidos-log" }
eidos-games = { path = "../eidos-games" }
eidos-launch = { path = "../eidos-launch" }
eidos-instance = { path = "../eidos-instance" }
eidos-plugins = { path = "../eidos-plugins" }
eidos-loot = { path = "../eidos-loot" }
eidos-install = { path = "../eidos-install" }
eidos-gamefeatures = { path = "../eidos-gamefeatures" }
# `eidos pack` / `eidos unpack`: a whole instance in one file.
eidos-transfer = { path = "../eidos-transfer" }
# Reading a collection's recipe and installing it in the order it asks for.
eidos-collections = { path = "../eidos-collections" }
eidos-fomod = { path = "../eidos-fomod" }
eidos-sevenzip = { path = "../eidos-sevenzip" }
eidos-nexus = { path = "../eidos-nexus" }

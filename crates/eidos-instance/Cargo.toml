[package]
name = "eidos-instance"
version = "0.0.0"
description = "Eidos instance model: global vs portable, mods/overwrite layout, load order"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
eidos-ini = { path = "../eidos-ini" }
# For case-variant resolution of the prefix control files (plugins.txt etc.):
# the prefix is case-sensitive while the game came from a case-insensitive
# filesystem, so both spellings can exist and only one is the truth.
eidos-plugins = { path = "../eidos-plugins" }

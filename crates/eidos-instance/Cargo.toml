[package]
name = "eidos-instance"
version.workspace = true
description = "Eidos instance model: global vs portable, mods/overwrite layout, load order"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
# The union filesystem's whiteout/opaque marker names: the overwrite capture has
# to skip them, and a second copy of the string in this crate would be a silent
# bug the day either one changed.
eidos-core = { path = "../eidos-core" }
eidos-ini = { path = "../eidos-ini" }
# For case-variant resolution of the prefix control files (plugins.txt etc.):
# the prefix is case-sensitive while the game came from a case-insensitive
# filesystem, so both spellings can exist and only one is the truth.
eidos-plugins = { path = "../eidos-plugins" }
# flock(2) for the cross-process instance lock: the GUI, the CLI and a running
# `eidos play` are separate processes writing the same profile files.
libc = "0.2"
# Game INIs are Windows ANSI (CP1252) as often as UTF-8; reading them as strict
# UTF-8 turned one accented byte into "the file is empty" in three places.
encoding_rs = "0.8"

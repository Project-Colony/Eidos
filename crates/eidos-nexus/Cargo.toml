[package]
name = "eidos-nexus"
version.workspace = true
description = "Eidos Nexus Mods integration: v1 API client, nxm:// links, MO2-compatible download .meta"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
ureq = { version = "3", features = ["json"] }
serde_json = "1"
# PKCE S256: a published transform with a published test vector. Hand-rolling a
# hash to save a dependency would trade an audited 200 lines for our own.
sha2 = "0.10"
base64 = "0.22"
# JWT signature verification for the OAuth access token. Already in the tree via
# ureq -> rustls, so this costs a line here and nothing at build time. Nexus
# signs with RSA-1024, which needs ring's explicitly-named legacy verifier.
ring = "0.17"
eidos-instance = { path = "../eidos-instance" }

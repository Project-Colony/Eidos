[package]
name = "eidos-paths"
version.workspace = true
description = "Where Eidos keeps its files: the Colony filesystem layout, and the migration onto it"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
# The ecosystem's one answer to "where does a Colony program keep its files".
# Rebuilding it here by hand is what the Colony layout rule exists to stop: the
# helper is the only place the `Colony/<Program>` shape, the absolute-only XDG
# rule and the per-platform roots are written down.
colony-ui = "0.1.5"
# Only for the roots of the layout Eidos used BEFORE it joined the ecosystem
# (`~/.config/eidos`, `~/.local/share/eidos`, `~/.local/state/eidos`), which no
# Colony helper names because no other program ever used them. Already in the
# graph through colony-ui, at the same version.
dirs = "7"

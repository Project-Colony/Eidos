[package]
name = "eidos-gui"
version.workspace = true
rust-version.workspace = true
description = "Eidos GUI (iced)"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
# The CLI, linked in: one file then serves as both programs (see startup.rs),
# which is what a Colony install is.
eidos = { path = "../eidos" }
eidos-paths = { path = "../eidos-paths" }
# utimensat(2): a transferred save has to keep its own timestamp, and std has
# no portable setter for one.
libc.workspace = true
# `smol` enables iced's timer subscriptions (`iced::time::every`), used to poll a
# launched game for exit while the GUI is locked.
# `advanced` is on for ONE thing: `iced::advanced::widget::operate`, which asks
# iced where a widget was actually laid out. It is what lets a menu hang from
# the button that opened it instead of from a coordinate somebody measured off
# a screenshot - a button is as wide as its label in the resolved font, so no
# literal can be right on every machine.
iced = { workspace = true, features = ["image", "smol", "advanced"] }
# For the hidden-file convention only: the GUI performs the hide/unhide rename,
# eidos-core decides what the mount shows, and both must agree on the suffix.
eidos-core = { path = "../eidos-core" }
# User extensions: declarative TOML add-ons run out of process.
eidos-addons = { path = "../eidos-addons" }
eidos-games = { path = "../eidos-games" }
# The Log pane reads the session logs the CLI writes, and shares its line format
# rather than re-deriving where the level sits in a line.
eidos-log = { path = "../eidos-log" }
eidos-launch = { path = "../eidos-launch" }
eidos-instance = { path = "../eidos-instance" }
eidos-nexus = { path = "../eidos-nexus" }
eidos-plugins = { path = "../eidos-plugins" }
eidos-loot = { path = "../eidos-loot" }
eidos-conflicts = { path = "../eidos-conflicts" }
eidos-gamefeatures = { path = "../eidos-gamefeatures" }
eidos-install = { path = "../eidos-install" }
eidos-fomod = { path = "../eidos-fomod" }
# `eidos pack` / `eidos unpack` in the window: a whole instance in one file.
eidos-transfer = { path = "../eidos-transfer" }
# Nexus mod ids are per game, so joining a collection member against the mod
# list needs the domain-to-short-name table the game definitions carry.
eidos-gamedef = { path = "../eidos-gamedef" }
# Installing a collection from the window runs the SAME driver the terminal
# does; a second copy of it here is how this workspace got three find_7z.
eidos-collections = { path = "../eidos-collections" }
rfd.workspace = true
# Pure Rust block decoding; no encoder or native toolchain is needed for previews.
bcdec_rs.workspace = true
ddsfile.workspace = true
tempfile.workspace = true
# Already used by iced; offload blocking preview work from its async executor.
smol.workspace = true
# Decode the bundled NIF helper's bounded geometry reply.
serde.workspace = true
serde_json.workspace = true
image-decoder = { workspace = true, features = ["png", "jpeg", "bmp", "gif", "webp", "ico", "tga"] }
# The 25 theme families / 57 palettes of the Colony ecosystem, the eight accent
# overrides, the high-contrast derivation and the shared pickers - generated from
# the design tokens in Project-Colony-Resources rather than copied here.
#
# Pinned to a tag, as Colony and Xion pin it: a change upstream must not be able
# to alter this window without a deliberate bump.
colony-ui.workspace = true

[dev-dependencies]
iced_runtime.workspace = true
iced_tiny_skia.workspace = true

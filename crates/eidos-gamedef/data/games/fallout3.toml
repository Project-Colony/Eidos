# Every xEdit release ships the editor and its QuickAutoClean twin, and the twin
# is what cleans the dirty edits LOOT warns about. PGPatcher makes a mixed
# texture setup use the right shaders (its argument: eidos_instance::default_args).
[[known_tools]]
exe = "FO3Edit.exe"
title = "FO3Edit"

[[known_tools]]
exe = "FO3EditQuickAutoClean.exe"

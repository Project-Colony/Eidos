id = "enderalse"
name = "Enderal: Special Edition"
short_name = "EnderalSE"
nexus_game = "enderalspecialedition"
# Enderal SE runs Skyrim SE mods from the SSE Nexus.
nexus_sources = ["skyrimspecialedition"]
steam_app_id = 976620
data_dir = "Data"
documents_dir = "Enderal Special Edition"
ini_files = ["Enderal.ini", "EnderalPrefs.ini"]
load_order = "Asterisk"
# The Skyrim masters load without an activation entry (GameDef::implicit_plugins);
# Enderal's own master and SkyUI must be explicitly active.
primary_plugins = [
    "Skyrim.esm",
    "Update.esm",
    "Dawnguard.esm",
    "HearthFires.esm",
    "Dragonborn.esm",
    "Enderal - Forgotten Stories.esm",
    "SkyUI_SE.esp",
]
game_binary = "SkyrimSE.exe"
# Enderal SE ships as a Skyrim SE reskin and uses SKSE64 unchanged.
script_extender = { launcher = "Enderal Launcher.exe", loader = "skse64_loader.exe" }

# Every xEdit release ships the editor and its QuickAutoClean twin, and the twin
# is what cleans the dirty edits LOOT warns about. PGPatcher makes a mixed
# texture setup use the right shaders (its argument: eidos_instance::default_args).
[[known_tools]]
exe = "SSEEdit.exe"
title = "SSEEdit"

[[known_tools]]
exe = "SSEEditQuickAutoClean.exe"
title = "SSEEdit QuickAutoClean"

[[known_tools]]
exe = "PGPatcher.exe"
title = "PGPatcher"

[[known_tools]]
exe = "Pandora Behaviour Engine+.exe"
title = "Pandora"

[[known_tools]]
exe = "Nemesis Unlimited Behavior Engine.exe"
title = "Nemesis"

[[known_tools]]
exe = "GenerateFNISforUsers.exe"
title = "FNIS"

[[known_tools]]
exe = "BodySlide x64.exe"
title = "BodySlide x64"

[[known_tools]]
exe = "DynDOLODx64.exe"
title = "DynDOLOD"

[[known_tools]]
exe = "TexGenx64.exe"
title = "TexGen"

[[known_tools]]
exe = "xLODGenx64.exe"
title = "xLODGen"

[[known_tools]]
exe = "Synthesis.exe"
title = "Synthesis"

[[known_tools]]
exe = "Bethini.exe"
title = "BethINI Pie"

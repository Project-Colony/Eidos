id = "oblivion"
name = "Oblivion"
short_name = "Oblivion"
nexus_game = "oblivion"
steam_app_id = 22330
data_dir = "Data"
documents_dir = "Oblivion"
ini_files = ["Oblivion.ini", "OblivionPrefs.ini"]
load_order = "FileTime"
primary_plugins = ["Oblivion.esm"]
game_binary = "Oblivion.exe"
registry_name = "Oblivion"
script_extender = { launcher = "OblivionLauncher.exe", loader = "obse_loader.exe" }

# Every xEdit release ships the editor and its QuickAutoClean twin, and the twin
# is what cleans the dirty edits LOOT warns about. PGPatcher makes a mixed
# texture setup use the right shaders (its argument: eidos_instance::default_args).
[[known_tools]]
exe = "TES4Edit.exe"
title = "TES4Edit"

[[known_tools]]
exe = "TES4EditQuickAutoClean.exe"
title = "TES4Edit QuickAutoClean"

[[known_tools]]
exe = "PGPatcher.exe"
title = "PGPatcher"

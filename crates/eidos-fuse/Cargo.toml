[package]
name = "eidos-fuse"
version.workspace = true
rust-version.workspace = true
description = "FUSE union daemon for the Eidos mod VFS"
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
eidos-core = { path = "../eidos-core" }
fuser.workspace = true
libc.workspace = true

[dev-dependencies]
# Integration tests mount a real union and check kernel-level behaviour.
fuser.workspace = true
libc.workspace = true

# The union integration test enters a private user+mount namespace (so its
# mounts are invisible to host desktop services and match how the product runs),
# which needs its own process entry point rather than the default test harness.
[[test]]
name = "union"
harness = false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Eidos">
  <title>Eidos</title>
  <!--
    L'icone carree : le losange seul, meme vocabulaire que la marque complete.
    Les strates du E passent a l'interieur - fragmentees en haut, pleines en bas.
    Concu pour rester lisible a 32 px : trait epais, noyau plein, 3 strates max.
  -->
  <defs>
    <clipPath id="lozenge">
      <path d="M128 40 L216 128 L128 216 L40 128 Z"/>
    </clipPath>
  </defs>
  <path d="M128 26 L230 128 L128 230 L26 128 Z" fill="none" stroke="#eaf2f7" stroke-width="16"/>
  <g clip-path="url(#lozenge)" fill="#eaf2f7">
    <rect x="64" y="86"  width="44" height="14"/>
    <rect x="118" y="86" width="20" height="14"/>
    <rect x="60" y="121" width="62" height="14"/>
    <rect x="132" y="121" width="18" height="14"/>
    <rect x="56" y="156" width="104" height="14"/>
  </g>
  <path d="M128 104 L152 128 L128 152 L104 128 Z" fill="#0a0b10"/>
  <path d="M128 112 L144 128 L128 144 L112 128 Z" fill="#eaf2f7"/>
</svg>
